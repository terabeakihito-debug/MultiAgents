name: PR57 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'refactor/extract-task-cleanup-service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused core tests
        run: npx vitest run src/core/task-cleanup-service.test.ts src/core/task-detail-service.test.ts src/core/task-service.test.ts --maxWorkers=1
      - run: npm run typecheck
      - run: npm run lint
      - name: Diff check
        run: git diff --check origin/main...HEAD
