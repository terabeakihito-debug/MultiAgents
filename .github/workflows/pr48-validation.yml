name: PR48 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/review-late-stage-reserve'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused review-flow tests
        run: npx vitest run src/flows/review.test.ts src/flows/review-provider-work-boundary.test.ts src/flows/review-late-stage-reserve.test.ts --maxWorkers=1
      - run: npm run typecheck
      - run: npm run lint
      - name: Diff check
        run: git diff --check origin/main...HEAD
